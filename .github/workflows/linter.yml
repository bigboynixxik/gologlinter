name: CI Linter Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26'

      - name: Run unit tests
        run: go test -v ./...

      - name: Build golangci-lint plugin
        run: go build -buildmode=plugin -o loglinter.so plugin/plugin.go